<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agent Copilot</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!--
    Third-party libraries are pinned to an exact version and guarded with a
    Subresource Integrity hash: a floating tag (chart.js@4) would let the CDN
    ship new code into an app that renders customer conversation data, with no
    review. To upgrade, change the version AND regenerate the hash:
      curl -sS <url> | openssl dgst -sha384 -binary | openssl base64 -A
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC"
    crossorigin="anonymous"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"
    integrity="sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb"
    crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">GC</div>
        <div class="brand-text">
          <div class="brand-title" id="brandTitle">Agent Copilot</div>
          <div class="brand-subtitle" id="envSubtitle">—</div>
        </div>
      </div>

      <div class="header-right">
        <div class="pill" id="authPill">Auth: starting…</div>
      </div>
    </header>

    <div class="app-body">
      <nav class="app-nav" id="appNav" aria-label="Main"></nav>

      <main class="app-main" id="appMain" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
